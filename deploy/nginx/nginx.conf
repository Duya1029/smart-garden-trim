# ==========================================================================
# 智慧园林·树木智能修剪决策平台 —— Nginx 反向代理配置
# 作用：
#   1) 托管前端打包产物（frontend/dist）
#   2) 将 /api 反向代理到后端内置 Tomcat（http://127.0.0.1:8080）
#   3) 直接托管后端上传目录（/upload），或按需转发给后端
#   4) 开启 gzip 压缩，提升前端静态资源加载速度
#
# 部署位置（Linux）：/usr/local/nginx/conf/nginx.conf  或  /etc/nginx/nginx.conf
# 重载命令：nginx -t && nginx -s reload
# ==========================================================================

# 后端服务地址（内置 Tomcat，application.yml 中 server.port=8080，context-path=/api）
# 若后端与 Nginx 不在同一台机器，把下面的 127.0.0.1 换成后端内网 IP
upstream smart_garden_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  localhost;              # 生产环境改为实际域名，如 garden.example.com

    charset utf-8;

    # 前端打包产物目录（把 frontend/dist 下的文件拷贝到此目录）
    root   /usr/share/nginx/html/smart-garden;
    index  index.html;

    # 上传接口需要放行较大的请求体（后端限制单文件 10MB，这里放宽到 50MB）
    client_max_body_size 50m;

    # ---------- gzip 压缩 ----------
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript
                      application/json application/javascript
                      application/x-javascript image/svg+xml;
    gzip_vary         on;
    gzip_disable      "MSIE [1-6]\.";

    # ---------- 前端静态资源（Vue Router history 模式） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源做长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---------- 后端接口反向代理 ----------
    # 注意：proxy_pass 末尾不带路径，保留原始 URI（含 /api 前缀），
    # 后端 context-path 也是 /api，二者必须一致
    location /api/ {
        proxy_pass         http://smart_garden_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---------- 上传图片访问 ----------
    # 方式一（推荐）：Nginx 直接托管后端上传目录，性能最好。
    #   需保证 Nginx 进程有该目录读权限，且与后端 garden.file.upload-path 指向同一目录。
    location /upload/ {
        alias /opt/smart-garden/upload/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # 方式二：若前端与后端不在同一台机器，改用下面这段转发给后端（放开注释、注释掉方式一）
    # location /upload/ {
    #     proxy_pass         http://smart_garden_backend;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }

    # ---------- 错误页（可选） ----------
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
