# ==========================================================================
# 智慧园林·树木智能修剪决策平台 —— 后端主配置
# 服务地址与端口在 server 节点配置；Spring Boot 使用内置 Tomcat
# ==========================================================================

server:
  # 服务端口
  port: 9999
  servlet:
    # 统一接口前缀，与 Nginx 反向代理规则保持一致
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 30m
  # 内置 Tomcat 线程与连接参数
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 200
      min-spare: 20
    accept-count: 200
    max-connections: 8192
    connection-timeout: 20000
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 2048

spring:
  application:
    name: smart-garden-trim

  # ---------- 数据源：SQL Server ----------
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://localhost:1433;databaseName=smart_garden;encrypt=false;trustServerCertificate=true;loginTimeout=30
    username: garden
    password: Garden@123456
    hikari:
      pool-name: SmartGardenPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # ---------- 文件上传 ----------
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # ---------- JSON 序列化 ----------
  jackson:
    time-zone: GMT+8
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# ---------- MyBatis（SQL 语句全部维护在 mapper XML 中） ----------
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.garden.smarttrim.entity
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    jdbc-type-for-null: NULL
    default-fetch-size: 100
    default-statement-timeout: 30

# ---------- 业务自定义配置 ----------
garden:
  # JWT 令牌
  jwt:
    # HS256 要求密钥长度不少于 32 字节
    secret: SmartGardenTrimPlatform2026SecretKeyForJwtHs256Algorithm
    expire-hours: 24
    header: Authorization
    prefix: "Bearer "
  # 文件上传
  file:
    # 物理存储目录（相对应用启动目录）
    upload-path: ./upload
    # 对外访问前缀
    access-prefix: /upload
    # 允许的图片扩展名
    allow-ext: jpg,jpeg,png,webp,bmp
  # AI 枝条识别
  ai:
    # mock：返回模拟数据（默认）；http：调用真实模型服务
    provider: mock
    # 真实模型服务地址（provider=http 时生效）
    endpoint: http://127.0.0.1:9000/api/v1/branch/analyze
    api-key: ""
    # 超时时间（毫秒）
    timeout: 10000
    model-version: mock-v1.0

logging:
  level:
    root: info
    com.garden.smarttrim: debug
    com.garden.smarttrim.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
